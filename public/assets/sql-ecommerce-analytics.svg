<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <!-- Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>
  <!-- Isometric Tables Node Graph -->
  <rect x="120" y="140" width="220" height="150" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="140" y="175" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">tbl_orders (PostgreSQL)</text>
  <line x1="140" y1="190" x2="320" y2="190" stroke="#334155" stroke-width="1"/>
  <text x="140" y="215" fill="#94a3b8" font-family="monospace" font-size="12">order_id [PK]</text>
  <text x="140" y="235" fill="#94a3b8" font-family="monospace" font-size="12">customer_id [FK]</text>
  <text x="140" y="255" fill="#38bdf8" font-family="monospace" font-size="12">repeat_purchase_rate &gt; 40%</text>

  <rect x="460" y="140" width="220" height="150" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <text x="480" y="175" fill="#06b6d4" font-family="monospace" font-size="14" font-weight="bold">tbl_cohort_retention</text>
  <line x1="480" y1="190" x2="660" y2="190" stroke="#334155" stroke-width="1"/>
  <text x="480" y="215" fill="#94a3b8" font-family="monospace" font-size="12">cohort_month [DATE]</text>
  <text x="480" y="235" fill="#94a3b8" font-family="monospace" font-size="12">DENSE_RANK() OVER(...)</text>
  <text x="480" y="255" fill="#38bdf8" font-family="monospace" font-size="12">LAG(revenue) OVER(...)</text>

  <!-- Connecting Path -->
  <path d="M 340 215 L 460 215" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="6 4"/>
  
  <!-- Growth Curve Chart at bottom -->
  <path d="M 120 420 Q 250 380, 400 340 T 680 240" fill="none" stroke="#10b981" stroke-width="4"/>
  <circle cx="680" cy="240" r="6" fill="#10b981"/>
  <text x="690" y="235" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">+42.5% MoM Growth</text>
</svg>