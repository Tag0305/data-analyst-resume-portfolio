<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#EEF7F0"/>
  <!-- Green Data Grid Lines -->
  <g stroke="#D7E5DA" stroke-width="1.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>
  <!-- White Card Nodes with Green Borders -->
  <rect x="120" y="140" width="230" height="160" rx="16" fill="#FFFFFF" stroke="#16803A" stroke-width="2.5"/>
  <text x="140" y="180" fill="#0B4F2A" font-family="sans-serif" font-size="15" font-weight="bold">tbl_orders (PostgreSQL)</text>
  <line x1="140" y1="195" x2="330" y2="195" stroke="#D7E5DA" stroke-width="1"/>
  <text x="140" y="220" fill="#506158" font-family="monospace" font-size="12">order_id [PK]</text>
  <text x="140" y="240" fill="#506158" font-family="monospace" font-size="12">customer_id [FK]</text>
  <text x="140" y="265" fill="#16803A" font-family="monospace" font-size="12" font-weight="bold">repeat_purchase &gt; 40%</text>

  <rect x="450" y="140" width="230" height="160" rx="16" fill="#FFFFFF" stroke="#2DBE64" stroke-width="2.5"/>
  <text x="470" y="180" fill="#0B4F2A" font-family="sans-serif" font-size="15" font-weight="bold">tbl_cohort_retention</text>
  <line x1="470" y1="195" x2="660" y2="195" stroke="#D7E5DA" stroke-width="1"/>
  <text x="470" y="220" fill="#506158" font-family="monospace" font-size="12">cohort_month [DATE]</text>
  <text x="470" y="240" fill="#506158" font-family="monospace" font-size="12">DENSE_RANK() OVER(...)</text>
  <text x="470" y="265" fill="#16803A" font-family="monospace" font-size="12" font-weight="bold">LAG(revenue) OVER(...)</text>

  <path d="M 350 220 L 450 220" stroke="#2DBE64" stroke-width="4" stroke-dasharray="6 4"/>

  <path d="M 120 420 Q 250 370, 400 330 T 680 230" fill="none" stroke="#16803A" stroke-width="4"/>
  <circle cx="680" cy="230" r="7" fill="#2DBE64"/>
  <text x="690" y="225" fill="#0B4F2A" font-family="sans-serif" font-size="13" font-weight="bold">+42.5% MoM Growth</text>
</svg>